name: Build Android APK

# Har push pe naya APK. Manually: Actions tab -> "Build Android APK" -> Run workflow.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.2.2"
  GODOT_CHANNEL: "stable"

jobs:
  build-apk:
    name: Godot 4.2.2 se Android APK
    runs-on: ubuntu-latest

    env:
      # Build log (fail hone pe error report me kaam aata hai)
      DIAG: ${{ github.workspace }}/build-log.txt
      # Optional: apna pakka keystore GitHub Secrets me daal sakte ho
      # ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_ALIAS / ANDROID_KEYSTORE_PASSWORD
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

    steps:
      - name: "1) Code checkout"
        uses: actions/checkout@v4

      - name: "2) Java 17 (keytool + Android signing)"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: "3) Android SDK + build-tools (apksigner / zipalign)"
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;34.0.0"

      # Godot release keystore ke bina export nahi karta, isliye pehle keystore banate hain.
      # Env var ke naam Godot 4.2 me fixed hain:
      # GODOT_ANDROID_KEYSTORE_RELEASE_PATH / _USER / _PASSWORD
      - name: "4) Keystore banao (ya secret se lo)"
        run: |
          set -euo pipefail
          touch "$DIAG"
          cd "$GITHUB_WORKSPACE"

          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "::notice::Secret wala keystore use ho raha hai" | tee -a "$DIAG"
            printf '%s' "$KEYSTORE_B64" | base64 -d > release.keystore
            ALIAS="$KEYSTORE_ALIAS"
            PASS="$KEYSTORE_PASSWORD"
          else
            echo "::notice::Koi secret nahi mila -> test keystore bana rahe hain" | tee -a "$DIAG"
            keytool -genkeypair -keystore release.keystore -storetype JKS \
              -storepass fpsgame123 -keypass fpsgame123 -alias fpskey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Free Fire Style FPS, OU=Game, O=Indie, L=Bikaner, S=RJ, C=IN" > /dev/null
            ALIAS="fpskey"
            PASS="fpsgame123"
          fi

          {
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$GITHUB_WORKSPACE/release.keystore"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$ALIAS"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$PASS"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$GITHUB_WORKSPACE/release.keystore"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=$ALIAS"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=$PASS"
            echo "USED_KEYSTORE_ALIAS=$ALIAS"
            echo "USED_KEYSTORE_PASS=$PASS"
          } >> "$GITHUB_ENV"

          mkdir -p build
          ls -lh release.keystore | tee -a "$DIAG"

      - name: "5) Godot 4.2.2 + export templates download"
        run: |
          set -euo pipefail
          touch "$DIAG"
          cd "$RUNNER_TEMP"
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          curl -sSL --retry 3 --retry-delay 5 -o godot.zip "${BASE}/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip"
          curl -sSL --retry 3 --retry-delay 5 -o templates.tpz "${BASE}/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_export_templates.tpz"
          ls -lh godot.zip templates.tpz | tee -a "$DIAG"

      - name: "6) Godot install + editor settings (SDK/JDK paths)"
        run: |
          set -euo pipefail
          touch "$DIAG"
          cd "$RUNNER_TEMP"

          # Godot binary -> ~/bin (sudo ki zaroorat nahi)
          mkdir -p "$HOME/bin"
          unzip -q -o godot.zip
          mv "Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" "$HOME/bin/godot"
          chmod +x "$HOME/bin/godot"
          echo "$HOME/bin" >> "$GITHUB_PATH"

          # export templates -> ~/.local/share/godot/export_templates/4.2.2.stable/
          unzip -q -o templates.tpz
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_CHANNEL}"
          mkdir -p "$TEMPLATE_DIR"
          mv templates/* "$TEMPLATE_DIR/"

          SDK_PATH="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          JDK_PATH="${JAVA_HOME:-}"
          BUILD_TOOLS_DIR="$(ls -d "$SDK_PATH"/build-tools/*/ 2>/dev/null | sort -V | tail -1 || true)"

          {
            echo "TEMPLATE_DIR: $TEMPLATE_DIR"
            echo "SDK:          $SDK_PATH"
            echo "JDK:          $JDK_PATH"
            echo "build-tools:  $BUILD_TOOLS_DIR"
            echo "templates:    $(ls "$TEMPLATE_DIR" | tr '\n' ' ')"
          } | tee -a "$DIAG"

          test -f "$TEMPLATE_DIR/android_release.apk" || { echo "::error::android_release.apk template nahi mila"; exit 1; }
          test -x "${BUILD_TOOLS_DIR}apksigner" || { echo "::error::apksigner nahi mila ($SDK_PATH/build-tools)"; exit 1; }
          test -n "$JDK_PATH" || { echo "::error::JAVA_HOME khali hai"; exit 1; }

          # Editor settings: Godot ko Android SDK / JDK / debug keystore batao
          mkdir -p "$HOME/.config/godot"
          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '' \
            '[resource]' \
            "export/android/android_sdk_path = \"$SDK_PATH\"" \
            "export/android/java_sdk_path = \"$JDK_PATH\"" \
            "export/android/debug_keystore = \"$GITHUB_WORKSPACE/release.keystore\"" \
            "export/android/debug_keystore_user = \"$USED_KEYSTORE_ALIAS\"" \
            "export/android/debug_keystore_pass = \"$USED_KEYSTORE_PASS\"" \
            "export/android/shutdown_adb_on_exit = true" \
            > "$HOME/.config/godot/editor_settings-4.tres"
          cat "$HOME/.config/godot/editor_settings-4.tres" | tee -a "$DIAG"

      - name: "7) Godot version check"
        run: |
          set -euo pipefail
          touch "$DIAG"
          godot --version 2>&1 | tee -a "$DIAG"

      # -------------------------------------------------------------- assets --
      # Asset pipeline:
      #   7d) Required Quaternius OBJ+MTL for weapons, nature, characters, vehicles, buildings.
      #       Conversion and per-category model counts are strict; missing assets fail CI.
      #   7d-b) Optional FBX conversion (fail-soft) via tools/fbx2glb.py.
      #   Sync Assets from Generator Repo: latest generated GLBs + optional textures.
      #   7e) GLB structure validation is strict (tools/glbcheck.py).
      # The tracked assets/models/*.glb files let local clones load real assets immediately.
      # These steps run before Project import so Godot can import the generated GLBs.
      - name: "7b) Cache: converted models"
        uses: actions/cache@v4
        with:
          path: assets/models
          # Key me dono source folders ka hash hai -> naya model aane pe naya cache
          key: cc0-glb-${{ hashFiles('assets/downloaded/**/*.fbx', 'assets/downloaded_obj/**/*.obj', 'assets/downloaded_obj/**/*.mtl', 'tools/obj2glb.py', 'tools/fbx2glb.py') }}

      # ---- 7d) OBJ -> GLB conversion (saare OBJ packs ka asli source) ----
      # assets/downloaded_obj/{Weapons,Nature,Characters,Vehicles,Buildings}/*.obj + *.mtl
      #   -> assets/models/{weapons,nature,characters,vehicles,buildings}/*.glb
      # (Godot 4 .obj import nahi karta, isliye build ke waqt convert hota hai.
      #  Har folder ka mode alag hai: weapons ka barrel -Z, baaki Y-up — dekho tools/obj2glb.py)
      - name: "7d) OBJ -> GLB conversion (weapons + nature + characters + vehicles + buildings)"
        run: |
          set -euo pipefail
          touch "$DIAG"
          cd "$GITHUB_WORKSPACE"

          mkdir -p build
          OUT="assets/models"
          OBJ_COUNT=$(find assets/downloaded_obj -name '*.obj' 2>/dev/null | wc -l)
          MTL_COUNT=$(find assets/downloaded_obj -name '*.mtl' 2>/dev/null | wc -l)
          echo "Quaternius OBJ sources: $OBJ_COUNT | matching MTL files: $MTL_COUNT" | tee -a "$DIAG"
          if [ "$OBJ_COUNT" -lt 132 ] || [ "$MTL_COUNT" -ne "$OBJ_COUNT" ]; then
            echo "::error::expected at least 132 OBJ + matching MTL sources; refusing to build a procedural-only APK"
            exit 1
          fi

          # Conversion is a required build step: a missing/invalid model must fail CI,
          # rather than silently shipping procedural weapon and map fallbacks.
          python3 tools/obj2glb.py assets/downloaded_obj --out-root "$OUT" \
            --report build/obj-report.json 2>&1 | tee -a "$DIAG"

          declare -A EXPECTED=( [weapons]=40 [nature]=66 [characters]=16 [vehicles]=7 [buildings]=3 )
          for CAT in weapons nature characters vehicles buildings; do
            CAT_COUNT=$(find "$OUT/$CAT" -name '*.glb' 2>/dev/null | wc -l)
            echo "  $CAT: $CAT_COUNT glb (expected at least ${EXPECTED[$CAT]})" | tee -a "$DIAG"
            if [ "$CAT_COUNT" -lt "${EXPECTED[$CAT]}" ]; then
              echo "::error::OBJ conversion incomplete for $CAT ($CAT_COUNT < ${EXPECTED[$CAT]})"
              exit 1
            fi
          done

          GLB_COUNT=$(find "$OUT" -name '*.glb' 2>/dev/null | wc -l)
          echo "Converted GLB total: $GLB_COUNT" | tee -a "$DIAG"
          if [ "$GLB_COUNT" -lt "$OBJ_COUNT" ]; then
            echo "::error::only $GLB_COUNT of $OBJ_COUNT OBJ models produced a GLB"
            exit 1
          fi

          # Raw OBJ/MTL build workspace se hata do (repo me safe hain):
          # Godot ko sirf .glb chahiye, aur assets/downloaded_obj/ me .gdignore hai
          # (isliye Godot us folder ko scan bhi nahi karta).
          find assets/downloaded_obj -name '*.obj' -delete
          find assets/downloaded_obj -name '*.mtl' -delete
          echo "OBJ/MTL build workspace se hata diye (repo me safe hain)" | tee -a "$DIAG"

      # ---- 7d) FBX -> GLB conversion (repo me pade CC0 models) ----
      # Godot 4 me FBX importer nahi hai — isliye pehle python se convert karte hain.
      # tools/fbx2glb.py pure stdlib hai (koi pip install nahi, koi binary download nahi).
      - name: "7d) FBX -> GLB conversion (Quaternius CC0 models)"
        continue-on-error: true
        run: |
          set -uo pipefail
          touch "$DIAG"
          cd "$GITHUB_WORKSPACE"

          mkdir -p build
          OUT="assets/models"
          FBX_COUNT=$(find assets/downloaded -name '*.fbx' 2>/dev/null | wc -l)
          echo "repo me FBX files: $FBX_COUNT" | tee -a "$DIAG"
          if [ "$FBX_COUNT" -eq 0 ]; then
            echo "::notice::koi optional .fbx nahi mila; required Quaternius OBJ models are already available" | tee -a "$DIAG"
            exit 0
          fi

          # .glb SIRF assets/models/ me jate hain (assets/downloaded/ me .gdignore hai,
          # isliye Godot wahan ka kuch bhi import nahi karta)
          # --skip-existing: jo .glb OBJ step (7d) ne bana diya hai use chhedo mat
          python3 tools/fbx2glb.py assets/downloaded --out-root "$OUT" --skip-existing \
            --report build/glb-report.json 2>&1 | tee -a "$DIAG" || \
            echo "::warning::conversion me kuch fail hua (jo ban gaya wahi use hoga)" | tee -a "$DIAG"

          GLB_COUNT=$(find "$OUT" -name '*.glb' 2>/dev/null | wc -l)
          echo "convert ho gaye: $GLB_COUNT glb -> $OUT" | tee -a "$DIAG"
          du -sh "$OUT"/* 2>/dev/null | tee -a "$DIAG" || true
          if [ "$GLB_COUNT" -eq 0 ]; then
            echo "::warning::ek bhi glb nahi bana -> procedural fallback chalega" | tee -a "$DIAG"
          fi

          # FBX ko build workspace se hata do:
          # Godot 4 na FBX import kar sakta hai na samajh sakta hai, aur bade packs pe
          # uska import scan ghanton atak jata hai (yahi is repo ka CI hang ho raha tha).
          # Source repo me pade rehte hain — yahan sirf build ke liye hata rahe hain.
          find assets/downloaded -name '*.fbx' -delete
          find assets/downloaded -name '*.fbx.import' -delete
          echo "FBX build workspace se hata diye (repo me safe hain)" | tee -a "$DIAG"

      # Sync after the cache/converters so they cannot overwrite generator assets.
      # assets/models/ is AssetLoader.BASE_DIRS' canonical runtime path; unlike
      # assets/downloaded/, it has no .gdignore and is included by all_resources.
      - name: "Sync Assets from Generator Repo"
        shell: bash
        run: |
          set -euo pipefail
          touch "$DIAG"
          cd "$GITHUB_WORKSPACE"

          ASSET_REPO="$(mktemp -d "$RUNNER_TEMP/indus-assets.XXXXXX")"
          trap 'rm -rf "$ASSET_REPO"' EXIT
          git clone --depth 1 --branch main --single-branch \
            https://github.com/lk0024709-ux/indus-assets-gen.git "$ASSET_REPO" 2>&1 | tee -a "$DIAG"
          ASSET_COMMIT="$(git -C "$ASSET_REPO" rev-parse HEAD)"
          SOURCE="$ASSET_REPO/docs/models"
          if [ ! -d "$SOURCE" ]; then
            echo "::error::Generator repo is missing docs/models/" | tee -a "$DIAG"
            exit 1
          fi
          MODEL_COUNT=$(find "$SOURCE" -type f \( -iname '*.glb' -o -iname '*.gltf' \) | wc -l)
          if [ "$MODEL_COUNT" -eq 0 ]; then
            echo "::error::No generated GLB/GLTF models found in docs/models/" | tee -a "$DIAG"
            exit 1
          fi

          mkdir -p assets/models
          # Copy the directory contents, including nested folders and glTF sidecars.
          cp -a "$SOURCE/." assets/models/
          TEXTURE_COUNT=0
          if [ -d "$ASSET_REPO/docs/textures" ]; then
            mkdir -p assets/textures
            cp -a "$ASSET_REPO/docs/textures/." assets/textures/
            TEXTURE_COUNT=$(find "$ASSET_REPO/docs/textures" -type f | wc -l)
          fi

          # .gitignore only affects Git tracking, NOT Godot import. A .gdignore,
          # however, would hide these files from Godot: fail instead of shipping it.
          if [ -f .gdignore ] || [ -f assets/.gdignore ] || \
            [ -n "$(find assets/models assets/textures -name .gdignore -print -quit 2>/dev/null || true)" ]; then
            echo "::error::.gdignore blocks synced assets; remove it before Godot import" | tee -a "$DIAG"
            exit 1
          fi

          echo "Generator commit: $ASSET_COMMIT" | tee -a "$DIAG"
          echo "Synced $MODEL_COUNT generated models -> res://assets/models/" | tee -a "$DIAG"
          echo "Synced $TEXTURE_COUNT texture files -> res://assets/textures/" | tee -a "$DIAG"
          {
            echo "## Generator asset sync"
            echo ""
            echo "Source: [indus-assets-gen@$ASSET_COMMIT](https://github.com/lk0024709-ux/indus-assets-gen/commit/$ASSET_COMMIT)"
            echo ""
            echo "Models: **$MODEL_COUNT** → res://assets/models/"
            echo "Textures: **$TEXTURE_COUNT** → res://assets/textures/ (optional)"
          } >> "$GITHUB_STEP_SUMMARY"

      # ---- 7e) .glb sanity check (header/accessors/index range) ----
      - name: "7e) GLB sanity check"
        run: |
          set -euo pipefail
          touch "$DIAG"
          cd "$GITHUB_WORKSPACE"
          python3 tools/glbcheck.py assets/models 2>&1 | tee -a "$DIAG"

      - name: "8) Project import (headless)"
        run: |
          set -euo pipefail
          touch "$DIAG"
          godot --headless --path "$GITHUB_WORKSPACE" --import 2>&1 | tee -a "$DIAG"
          ls -la "$GITHUB_WORKSPACE/.godot" | tee -a "$DIAG"

      - name: "8b) GDScript syntax check (har script ka parse gate)"
        run: |
          set -uo pipefail
          touch "$DIAG"
          cd "$GITHUB_WORKSPACE"

          # pehle cross-file reference check (gdlint isko nahi pakadta, Godot pakadta hai)
          python3 tools/gdcheckrefs.py --params 2>&1 | tee -a "$DIAG" || \
            echo "::warning::gdcheckrefs ne kuch shak wali cheez batayi (neeche Godot ka parse gate decide karega)"

          bad=0
          for f in scripts/*.gd; do
            # `if ... then ... else` pattern zaroori hai: GitHub ke run: steps me
            # bash -e chalta hai, aur check fail hone pe (non-zero) script wahin
            # ruk jata — output dikhta hi nahi tha.
            if out=$(godot --headless --path . --check-only --script "res://${f}" 2>&1); then
              code=0
            else
              code=$?
            fi
            if [ $code -ne 0 ] || echo "$out" | grep -qiE "parse error|script error|failed to load"; then
              bad=$((bad + 1))
              echo "--- $f ---" | tee -a "$DIAG"
              echo "$out" | tee -a "$DIAG"
            else
              echo "OK   $f"
            fi
          done
          if [ $bad -gt 0 ]; then
            echo "::error::$bad script(s) me syntax error hai — upar wala output dekho (aur fail hone pe commit comment me bhi aayega)"
            exit 1
          fi
          echo "Saare scripts sahi parse hue ✔" | tee -a "$DIAG"

      - name: "8c) Import log me error scan (broken scene/script)"
        run: |
          set -uo pipefail
          if [ ! -f "$DIAG" ]; then echo "log nahi mila, skip"; exit 0; fi
          matches=$(grep -nE "Parse Error|SCRIPT ERROR|Failed to load script|Failed to load resource|Invalid export preset" "$DIAG" || true)
          if [ -n "$matches" ]; then
            echo "::error::Import/parse step me error mila — neeche dekho (aur commit comment me bhi aayega)"
            echo "$matches"
            exit 1
          fi
          echo "Import log saaf hai ✔ (koi parse/load error nahi)"

      # ---- 8d) Game ka asset selftest (headless, 5-10 second) ----
      # scripts/selftest.gd: loader + 28 weapons + character + nature + vehicle + fail-soft.
      # Kuch bhi galat ho to ye step RED ho jata hai — silent kharab APK nahi banega.
      - name: "8d) Asset selftest (downloaded models + procedural fallback)"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          touch "$DIAG"
          cd "$GITHUB_WORKSPACE"

          LOG="$RUNNER_TEMP/selftest.log"
          echo "godot: $(command -v godot || echo nahi-mila) | scene: $([ -f scenes/selftest.tscn ] && echo mila || echo GAYAB)"

          # ---------------------------------------------------------------
          # DHYAAN: GitHub ke "run:" steps me bash -e chalta hai. Selftest fail
          # hone pe godot exit code 1 deta hai — pehle usi wajah se ye step
          # 0 second me chup-chaap fail ho jata tha aur output kahin nahi dikhta
          # (na log me, na commit comment me). Isliye yahan `set +e` hai.
          # ---------------------------------------------------------------
          set +e
          godot --headless --path . --quit-after 600 scenes/selftest.tscn > "$LOG" 2>&1
          RC=$?
          set -e

          cat "$LOG" | tee -a "$DIAG"
          echo "godot exit code: $RC" | tee -a "$DIAG"

          # run page pe summary (phone se padhna aasan)
          {
            echo "## Asset selftest"
            echo ""
            echo '```'
            grep -E "note:|SELFTEST|FAIL:" "$LOG" | tail -n 40 || tail -n 40 "$LOG"
            echo '```'
            echo "exit code: $RC"
          } >> "$GITHUB_STEP_SUMMARY" || true

          if [ "$RC" -eq 0 ] && grep -q "SELFTEST_EXIT_OK" "$LOG"; then
            echo "::notice::Asset selftest PASS (downloaded + procedural dono chal rahe hain)"
            exit 0
          fi

          # FAIL: poora output commit comment me daal do (run page ke alawa
          # yahin se bhi padha ja sake — aur CI ke bahar se bhi).
          {
            echo "## Asset selftest FAIL (run ${GITHUB_RUN_ID}, exit code ${RC})"
            echo ""
            echo '```'
            tail -c 9000 "$LOG" 2>/dev/null || echo "(selftest log khali hai)"
            echo '```'
          } > "$RUNNER_TEMP/selftest-report.md"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -F body=@"$RUNNER_TEMP/selftest-report.md" || echo "comment post nahi hua"
          echo "::error::Asset selftest FAIL — upar ka output aur commit comment dekho (game phir bhi procedural pe banta rahega)"
          exit 1

      # ---- 8e) Map build smoke test (buildings + nature + vehicles) ----
      # Poora main scene headless chalta hai (180 frames) aur map ki summary lines
      # check karta hai. Isse pata chalta hai ki buildings/nature/gaadiyaan SACH ME
      # banti hain (sirf code parse hona kaafi nahi).
      - name: "8e) Map build smoke test (buildings + nature + vehicles)"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          touch "$DIAG"
          cd "$GITHUB_WORKSPACE"

          LOG="$RUNNER_TEMP/map.log"
          set +e
          godot --headless --path . --quit-after 180 scenes/main.tscn > "$LOG" 2>&1
          RC=$?
          set -e

          BUILDINGS=$(sed -nE 's/.*Buildings: ([0-9]+) placed.*/\1/p' "$LOG" | tail -1)
          VEHICLES=$(sed -nE 's/.*Vehicles: ([0-9]+) placed.*/\1/p' "$LOG" | tail -1)
          NATURE=$(sed -nE 's/.*Nature: ([0-9]+) props placed.*/\1/p' "$LOG" | tail -1)
          BUILDINGS=${BUILDINGS:-0}
          VEHICLES=${VEHICLES:-0}
          NATURE=${NATURE:-0}

          echo "map summary: buildings=$BUILDINGS vehicles=$VEHICLES props=$NATURE" | tee -a "$DIAG"
          grep -E "Buildings:|Nature:|Vehicles:" "$LOG" | tail -5 | tee -a "$DIAG" || true
          grep -E "SCRIPT ERROR|ERROR:" "$LOG" | head -15 | tee -a "$DIAG" || true
          echo "godot exit code: $RC" | tee -a "$DIAG"

          {
            echo "## Map build smoke test"
            echo ""
            echo "buildings: **$BUILDINGS** | vehicles: **$VEHICLES** | nature props: **$NATURE**"
            echo ""
            echo '```'
            grep -E "Buildings:|Nature:|Vehicles:|SCRIPT ERROR|ERROR:" "$LOG" | head -25 || echo "(koi line nahi)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true

          # script errors alag se report karo — build green ho par log me error ho to
          # commit comment pe dikh jaye (chhup ke na reh jaye)
          ERROR_COUNT=$(grep -c "SCRIPT ERROR" "$LOG" 2>/dev/null || true)
          ERROR_COUNT=${ERROR_COUNT:-0}
          if [ "$ERROR_COUNT" -gt 0 ]; then
            {
              echo "## Map build: $ERROR_COUNT script error(s) (build phir bhi pass)"
              echo ""
              echo '```'
              grep -E "SCRIPT ERROR|at: " "$LOG" | head -30
              echo '```'
            } > "$RUNNER_TEMP/map-errors.md"
            gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
              -F body=@"$RUNNER_TEMP/map-errors.md" || echo "comment post nahi hua"
            echo "::warning::Map me $ERROR_COUNT script errors hain (details commit comment me)"
          fi

          if [ "$BUILDINGS" -ge 10 ] && [ "$VEHICLES" -ge 6 ] && [ "$NATURE" -ge 30 ]; then
            echo "::notice::Map PASS: $BUILDINGS buildings, $VEHICLES vehicles, $NATURE nature props"
            exit 0
          fi

          {
            echo "## Map build FAIL (run ${GITHUB_RUN_ID})"
            echo ""
            echo "buildings=$BUILDINGS (>=10 chahiye), vehicles=$VEHICLES (>=6), nature=$NATURE (>=30)"
            echo ""
            echo '```'
            grep -E "Buildings:|Nature:|Vehicles:|SCRIPT ERROR|ERROR:|at: " "$LOG" | head -40 || tail -40 "$LOG"
            echo '```'
          } > "$RUNNER_TEMP/map-report.md"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -F body=@"$RUNNER_TEMP/map-report.md" || echo "comment post nahi hua"
          echo "::error::Map build FAIL — buildings/vehicles/nature nahi bane (upar summary dekho)"
          exit 1

      # ---- 8f) Terrain-only island collision + walking test ----
      # Dedicated scene: no gameplay manager, player loadout, buildings, vehicles, or enemies.
      # It ray-checks beach/hill/ramp/plateau/industrial ground, then walks a probe capsule
      # from the beach up the north ramp to prove the collision remains continuous.
      - name: "8f) Terrain-only island ray + walkability test"
        run: |
          set -uo pipefail
          touch "$DIAG"
          cd "$GITHUB_WORKSPACE"

          LOG="$RUNNER_TEMP/terrain-selftest.log"
          set +e
          godot --headless --path . --fixed-fps 60 --quit-after 2400 \
            scenes/terrain_selftest.tscn > "$LOG" 2>&1
          RC=$?
          set -e

          cat "$LOG" | tee -a "$DIAG"
          {
            echo "## Terrain-only island collision and walkability test"
            echo ""
            echo '```'
            grep -E "TERRAIN_SELFTEST|ISLAND:|SCRIPT ERROR|ERROR:" "$LOG" | tail -n 30 || tail -n 30 "$LOG"
            echo '```'
            echo "exit code: $RC"
          } >> "$GITHUB_STEP_SUMMARY" || true

          if [ "$RC" -eq 0 ] && grep -q "TERRAIN_SELFTEST_PASS" "$LOG"; then
            echo "::notice::Terrain walkability PASS: beach -> hills -> plateau"
            exit 0
          fi

          echo "::error::Terrain collision/walkability test failed"
          exit 1

      # ---- 8f2) Rannbhoomi Land Map + Plane Drop + Pro Mobile HUD full verification ----
      - name: "8f2) Rannbhoomi Map + Plane Drop + Pro HUD test"
        run: |
          set -uo pipefail
          touch "$DIAG"
          cd "$GITHUB_WORKSPACE"

          LOG="$RUNNER_TEMP/rannbhoomi-selftest.log"
          set +e
          godot --headless --path . --fixed-fps 60 --quit-after 600 \
            scenes/rannbhoomi_selftest.tscn > "$LOG" 2>&1
          RC=$?
          set -e

          cat "$LOG" | tee -a "$DIAG"
          {
            echo "## Rannbhoomi Land Map + Plane Drop + Pro HUD verification"
            echo ""
            echo '```'
            grep -E "\[PASS\]|RANNBHOOMI_SELFTEST|SCRIPT ERROR|ERROR:" "$LOG" | tail -n 55 || tail -n 55 "$LOG"
            echo '```'
            echo "exit code: $RC"
          } >> "$GITHUB_STEP_SUMMARY" || true

          if [ "$RC" -eq 0 ] && grep -q "RANNBHOOMI_SELFTEST_PASS" "$LOG"; then
            echo "::notice::Rannbhoomi Map + Plane Drop + Pro HUD PASS"
            exit 0
          fi

          echo "::error::Rannbhoomi Map / Plane Drop / Pro HUD self-test failed"
          exit 1

      # ---- 8f3) TPV + 200 HP + hitscan/pool live-physics regression test ----
      - name: "8f3) Third-person camera + balanced HP + hitscan pool test"
        run: |
          set -uo pipefail
          cd "$GITHUB_WORKSPACE"
          LOG="$RUNNER_TEMP/combat-selftest.log"
          set +e
          godot --headless --path . --fixed-fps 60 --quit-after 120 \
            scenes/combat_selftest.tscn > "$LOG" 2>&1
          RC=$?
          set -e
          cat "$LOG"
          if [ "$RC" -eq 0 ] && grep -q "COMBAT_SELFTEST_PASS" "$LOG" \
            && ! grep -q "SCRIPT ERROR" "$LOG"; then
            echo "::notice::TPV, 200 HP, instant hitscan and fixed VFX pools PASS"
            exit 0
          fi
          echo "::error::TPV / HP / hitscan / pool combat self-test failed"
          exit 1

      # ---- 8g) UI flow smoke test (splash -> loading -> home -> main) ----
      # Poora UI flow headless chalta hai. `--fixed-fps 60` isliye ki headless me
      # frames bahut tez chalte hain, par Tween/Timer "game time" pe chalte hain —
      # fixed fps se 1200 frames = 20 second ka game time milta hai.
      # Har screen apna marker print karti hai; koi marker na mile to step RED.
      - name: "8g) UI flow smoke test (splash -> loading -> home)"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          touch "$DIAG"
          cd "$GITHUB_WORKSPACE"

          LOG="$RUNNER_TEMP/ui-flow.log"
          set +e
          godot --headless --path . --fixed-fps 60 --quit-after 1200 \
            scenes/splash.tscn -- --ui-test > "$LOG" 2>&1
          RC=$?
          set -e

          cat "$LOG" | tee -a "$DIAG"

          FAIL=""
          for MARK in "SPLASH: done -> loading" "LOADING: done -> home" "HOME: ready" \
                      "HOME: bg loaded -> res://assets/ui/home_bg.png" \
                      "HOME: BATTLE -> main" "Buildings:"; do
            if grep -qF "$MARK" "$LOG"; then
              echo "  OK   $MARK" | tee -a "$DIAG"
            else
              echo "  MISS $MARK" | tee -a "$DIAG"
              FAIL="${FAIL}${MARK}; "
            fi
          done

          {
            echo "## UI flow smoke test"
            echo ""
            echo "splash -> loading -> home -> main  (godot exit code: $RC)"
            echo ""
            echo '```'
            grep -E "SPLASH:|LOADING:|HOME:|Buildings:|SCRIPT ERROR" "$LOG" | head -30 || tail -30 "$LOG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true

          if [ -z "$FAIL" ]; then
            echo "::notice::UI flow PASS: splash -> loading -> home -> main"
            exit 0
          fi

          {
            echo "## UI flow FAIL (run ${GITHUB_RUN_ID}, exit code ${RC})"
            echo ""
            echo "Missing markers: $FAIL"
            echo ""
            echo '```'
            grep -E "SPLASH:|LOADING:|HOME:|SCRIPT ERROR|ERROR:|at: " "$LOG" | head -40 || tail -40 "$LOG"
            echo '```'
          } > "$RUNNER_TEMP/ui-flow-report.md"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -F body=@"$RUNNER_TEMP/ui-flow-report.md" || echo "comment post nahi hua"
          echo "::error::UI flow FAIL — splash/loading/home/main me se koi step nahi chala"
          exit 1

      - name: "9) APK export (release)"
        run: |
          set -euo pipefail
          touch "$DIAG"
          cd "$GITHUB_WORKSPACE"
          mkdir -p build
          godot --headless --path . --export-release Android 2>&1 | tee -a "$DIAG"
          ls -lh build/ | tee -a "$DIAG" || true

      - name: "9a) Verify APK package, version, and signature"
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/build/Indus_Battle_Royal.apk"
          test -s "$APK"
          grep -F 'export_path="build/Indus_Battle_Royal.apk"' export_presets.cfg
          grep -F 'version/code=1' export_presets.cfg
          grep -F 'version/name="1.0.0"' export_presets.cfg
          grep -F 'package/unique_name="com.auragames.indus"' export_presets.cfg
          grep -F 'package/name="Indus : Battle Royale"' export_presets.cfg

          SDK_PATH="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          BUILD_TOOLS_DIR="$(ls -d "$SDK_PATH"/build-tools/*/ 2>/dev/null | sort -V | tail -1)"
          APKSIGNER="${BUILD_TOOLS_DIR}apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

          # Print APK metadata when aapt is available. Export preset is the strict source
          # of truth; this dump also makes any platform-specific label formatting visible.
          AAPT="${BUILD_TOOLS_DIR}aapt"
          if [ -x "$AAPT" ]; then
            if BADGING="$("$AAPT" dump badging "$APK" 2>&1)"; then
              printf '%s\n' "$BADGING" | tee -a "$DIAG"
              if printf '%s\n' "$BADGING" | grep -Fq "package: name='com.auragames.indus'" \
                && printf '%s\n' "$BADGING" | grep -Fq "versionCode='1'" \
                && printf '%s\n' "$BADGING" | grep -Fq "versionName='1.0.0'" \
                && printf '%s\n' "$BADGING" | grep -Fq "application-label:'Indus : Battle Royale'"; then
                echo "APK metadata verified: com.auragames.indus / Indus : Battle Royale / 1.0.0 (1)" | tee -a "$DIAG"
              else
                echo "::warning::aapt metadata formatting did not match the expected label; export preset values above are checked"
              fi
            else
              echo "::warning::aapt could not dump metadata; signed APK and export settings were still validated"
              printf '%s\n' "$BADGING" | tee -a "$DIAG"
            fi
          else
            echo "::notice::aapt unavailable; APK signature and export settings were verified"
          fi

      # GitHub ke run page pe asset summary (phone se dekhne me aasan)
      - name: "9b) Asset summary (run page pe)"
        if: always()
        run: |
          {
            echo "## Asset summary"
            echo ""
            echo '| folder | files | size |'
            echo '|---|---|---|'
            for d in weapons nature characters vehicles buildings; do
              f=$(find "assets/models/$d" -name '*.glb' 2>/dev/null | wc -l)
              s=$(du -sh "assets/models/$d" 2>/dev/null | cut -f1)
              echo "| $d | $f glb | ${s:-0} |"
            done
            echo ""
            echo "OBJ -> GLB: tools/obj2glb.py | optional FBX -> GLB: tools/fbx2glb.py | checker: tools/glbcheck.py"
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: "10) APK ka naam pakka karo"
        run: |
          set -euo pipefail
          touch "$DIAG"
          APK="$GITHUB_WORKSPACE/build/Indus_Battle_Royal.apk"
          if [ ! -s "$APK" ]; then
            echo "::error::expected build/Indus_Battle_Royal.apk; export step produced no final APK"
            exit 1
          fi
          cp "$APK" "$GITHUB_WORKSPACE/Indus_Battle_Royal.apk"
          ls -lh "$GITHUB_WORKSPACE/Indus_Battle_Royal.apk" | tee -a "$DIAG"

      - name: "11) APK upload (workflow page se download)"
        uses: actions/upload-artifact@v4
        with:
          name: Indus_Battle_Royal-apk
          path: Indus_Battle_Royal.apk
          if-no-files-found: error

      # Phone pe install karna aasan: "latest-apk" release me pakka download link
      - name: "12) Release me daalo (phone pe direct download)"
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest-apk >/dev/null 2>&1 || \
            gh release create latest-apk --title "Latest APK" --notes "Automatically built APK. Phone me ye file download karke install karo (Settings me 'install unknown apps' allow karna padega)."
          gh release upload latest-apk Indus_Battle_Royal.apk --clobber

      # Agar kuch fail ho jaye to error commit-comment me likh do,
      # taaki direct yahin se padha ja sake.
      - name: "13) Fail hone pe error report"
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch "$DIAG"
          {
            echo "## Build fail: $(date -u)"
            echo ""
            echo '```'
            tail -c 5000 "$DIAG" 2>/dev/null || echo "(log khali hai)"
            echo '```'
            echo ""
            echo "Steps: $(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" --jq '.jobs[0].steps[] | "\(.name)=\(.conclusion)"' 2>/dev/null | tr '\n' ' ')"
          } > "$RUNNER_TEMP/report.md"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@"$RUNNER_TEMP/report.md" || echo "comment post nahi hua"
      - name: "14) Build log upload (diagnostics)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt
          if-no-files-found: ignore
          retention-days: 14
